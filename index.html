<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de produtividade · Hora a Hora</title>
<style>
:root{--bg:#00121e;--card:#001724;--line:#194152;--text:#f4f7ff;--muted:#a9bece;--green:#00e59d;--blue:#00b6f5;--red:#ff3c67;--yellow:#ffd32c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#042332,#000c16 80%);color:var(--text);font:14px Arial,sans-serif}main{max-width:1800px;margin:auto;padding:14px}header{display:flex;align-items:center;gap:24px;border-bottom:4px solid var(--yellow);padding-bottom:12px;margin-bottom:12px}.logo{background:white;border-radius:5px;color:#13569b;padding:4px 6px;font-size:27px;font-weight:bold;white-space:nowrap}.logo b{background:#ed1834;color:white;padding:4px;border-radius:20px}.logo i{font-family:Georgia,serif}.title{flex:1}.title strong{font-size:clamp(20px,2vw,30px)}.title p{margin:4px 0;color:var(--muted)}nav{display:flex;gap:8px}nav a{color:white;text-decoration:none;border:1px solid var(--line);padding:17px;border-radius:5px}nav .active{background:var(--yellow);color:#00121e;font-weight:bold}.date{border:1px solid var(--line);border-radius:5px;padding:10px 16px;min-width:165px}.date small{display:block;color:var(--muted);margin-bottom:4px}.date strong{font-size:19px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px;min-height:85px}.kpi small{color:var(--muted);display:block;font-size:11px;margin-bottom:7px}.kpi strong{font-size:27px}.kpi em{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--accent);border-radius:6px;overflow:hidden;background:#00131fc9;margin-bottom:12px}.sep{--accent:var(--green);--tint:#003d32}.rem{--accent:var(--red);--tint:#3b0b22}.panelhead{display:flex;align-items:center;background:linear-gradient(90deg,var(--tint),#00131f);border-bottom:1px solid var(--accent);min-height:54px}.panelhead h2{font-size:16px;flex:1;margin:0;padding:12px}.metric{padding:9px 14px;border-left:1px solid var(--line)}.metric small{display:block;font-size:10px;color:var(--accent);margin-bottom:4px}.metric strong{font-size:21px}.legend{display:flex;justify-content:center;gap:20px;font-size:11px;color:var(--muted);padding:12px}.legend span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--green)}.rem .legend span:first-child:before{background:var(--blue)}.legend span:nth-child(2):before{background:var(--yellow)}.legend span:nth-child(3):before{border-top:2px dashed white;background:none;border-radius:0;width:20px;height:3px}svg{display:block;width:100%;height:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 9px;border-bottom:1px solid #173748;border-right:1px solid #173748;text-align:center}th{background:var(--tint);font-weight:normal;color:var(--muted)}tfoot td{background:var(--tint);color:var(--accent);font-weight:bold;font-size:15px}.bar{height:10px;background:#001520;border:1px solid var(--line);border-radius:3px;overflow:hidden;display:inline-block;width:62%;vertical-align:middle;margin-right:6px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}.rankings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rank{--accent:var(--green);--tint:#00372c}.rank.bad{--accent:var(--red);--tint:#350b20}.rank.blue{--accent:var(--blue);--tint:#002d43}.rank h2{font-size:12px;padding:11px;margin:0;color:var(--accent);border-bottom:1px solid var(--line)}.rank td:nth-child(2){text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank th{font-size:10px}.rank td{padding:8px 6px}.note{color:var(--muted);font-size:11px;line-height:1.6;margin:6px 0}#error{padding:30px;border:1px solid var(--red);display:none}.ok{color:var(--green)}.warn{color:var(--yellow)}.low{color:var(--red)}
@media(max-width:1100px){header{flex-wrap:wrap;gap:12px}.kpis{grid-template-columns:repeat(3,1fr)}.rankings{grid-template-columns:1fr 1fr}.panelhead h2{font-size:12px}.metric{padding:8px}.metric strong{font-size:17px}}
@media(max-width:700px){main{padding:8px}.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.rankings{grid-template-columns:1fr}.logo{font-size:22px}.title strong{font-size:27px}nav{width:100%}nav a{flex:1;text-align:center;padding:12px}.date{flex:1;min-width:0}.legend{gap:10px;font-size:9px}.kpi strong{font-size:23px}}

'use strict';
const number=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}),dec=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
const n=x=>number.format(Number(x)||0),pct=x=>dec.format(x*100)+'%',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const excel=x=>new Date(Math.round((x-25569)*86400000)),hour=x=>excel(x).getUTCHours().toString().padStart(2,'0')+'h',color=x=>x>=1?'ok':x>=.7?'warn':'low';
function render(d){
 if(!d||!Array.isArray(d.resumo)||d.resumo.length<12||!Array.isArray(d.cadastro)||!Array.isArray(d.painel))throw Error('Arquivo incompleto');
 const r=d.resumo,c=d.cadastro.slice(1).filter(x=>x[0]!=null),p=d.painel;
 const value=(row,col)=>Number(r[row-1][col-1])||0;
 const absent=c.filter(x=>/FALTA|FERIAS|FÉRIAS|AFASTAD|LICEN[CÇ]A/i.test(String(x[7]))).length;
 const unknown=c.filter(x=>!x[7]||String(x[7]).trim()==='-').length;
 const present=c.length-absent-unknown;
 document.getElementById('date').textContent=excel(value(1,2)).toLocaleDateString('pt-BR',{timeZone:'UTC'});
 document.getElementById('update').textContent=String(d.atualizadoEm||'—').slice(11,16);
 const kpi=(label,total,cls='',sub='')=>`<div class="kpi"><small>${label}</small><strong class="${cls}">${total}</strong><em>${sub}</em></div>`;
 document.getElementById('kpis').innerHTML=kpi('STAFF CADASTRADO',n(c.length),'','Equipe no cadastro')+kpi('PRESENTES',n(present),'ok','Separação, remonte e outras posições')+kpi('AUSENTES',n(absent),'low','Inclui faltas, férias e afastamentos')+kpi('META INDIVIDUAL',n(value(1,7))+' / '+n(value(2,7)),'','Separação / Remonte · cxs')+kpi('VOLUME SEPARAÇÃO',n(value(12,2))+' cxs','ok',pct(value(9,7))+' da meta do turno')+kpi('VOLUME REMONTE',n(value(12,3))+' cxs','',''+pct(value(10,7))+' da meta do turno');
 const groups=[{type:'sep',name:'SEPARAÇÃO',staff:value(3,7),goal:value(6,7),total:value(12,2),ratio:value(9,7),vol:1,meta:8,status:10,best:[1,2],worst:[4,5],fill:'#00df98'},{type:'rem',name:'REMONTE (2ª CONFERÊNCIA)',staff:value(4,7),goal:value(7,7),total:value(12,3),ratio:value(10,7),vol:2,meta:9,status:11,best:[7,8],worst:[10,11],fill:'#00b6f5'}];
 const rows=r.slice(3,11);
 document.getElementById('charts').innerHTML=groups.map(g=>`<section class="panel ${g.type}"><div class="panelhead"><h2>▣ PRODUTIVIDADE HORA A HORA · ${g.name}</h2><div class="metric"><small>META TURNO</small><strong>${n(g.goal)} cxs</strong></div><div class="metric"><small>ATINGIMENTO</small><strong class="${color(g.ratio)}">${pct(g.ratio)}</strong></div></div><div class="legend"><span>Caixas</span><span>Média por pessoa (cxs/h)</span><span>Meta por pessoa (cxs/h)</span></div>${chart(rows,g)}</section>`).join('');
 document.getElementById('tables').innerHTML=groups.map(g=>`<section class="panel ${g.type}"><div class="panelhead"><h2>▣ DETALHAMENTO HORA A HORA · ${g.name}</h2></div><table><thead><tr><th>HORA</th><th>STAFF</th><th>CAIXAS</th><th>MÉDIA/PESSOA</th><th>% DA META DO TURNO</th><th>STATUS</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${hour(x[0])}</td><td>${n(g.staff)}</td><td>${n(x[g.vol])}</td><td>${g.staff?dec.format(x[g.vol]/g.staff):'—'}</td><td><span class="bar"><i style="width:${Math.min(100,g.goal?100*x[g.vol]/g.goal:0)}%"></i></span>${g.goal?pct(x[g.vol]/g.goal):'—'}</td><td class="${x[g.status]==='✓'?'ok':x[g.status]==='✕'?'low':'warn'}">${esc(x[g.status])}</td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL</td><td>${n(g.staff)}</td><td>${n(g.total)}</td><td>${g.staff?dec.format(g.total/g.staff):'—'}</td><td>${pct(g.ratio)}</td><td>Turno</td></tr></tfoot></table></section>`).join('');
 document.getElementById('ranks').innerHTML=groups.map(g=>[false,true].map(bad=>{const cols=bad?g.worst:g.best;return `<section class="panel rank ${bad?'bad':g.type==='rem'?'blue':''}"><h2>${bad?'▼ 3 MENORES':'🏆 TOP 3'} · ${g.type==='sep'?'SEPARAÇÃO':'REMONTE'}</h2><table><thead><tr><th>#</th><th>COLABORADOR</th><th>CAIXAS</th><th>MÉDIA/HORA</th></tr></thead><tbody>${p.slice(3,6).map((x,i)=>`<tr><td>${i+1}</td><td title="${esc(x[cols[0]])}">${esc(x[cols[0]]||'—')}</td><td>${x[cols[0]]?n(x[cols[1]]):'—'}</td><td>${x[cols[0]]&&value(12,8)?dec.format(x[cols[1]]/value(12,8)):'—'}</td></tr>`).join('')}</tbody></table></section>`}).join('')).join('');
 document.getElementById('notes').textContent='Dados da base até '+excel(value(12,7)).toLocaleString('pt-BR',{timeZone:'UTC'})+' · Exportação: '+d.atualizadoEm+' · Metas e rankings conforme a planilha. Média dos rankings calculada sobre '+dec.format(value(12,8))+' horas produtivas do turno.'+(unknown?' · '+unknown+' colaborador(es) sem posição informada.':'');
 document.getElementById('error').style.display='none';document.getElementById('content').style.display='block';
}
function chart(rows,g){
 const W=760,H=230,left=58,right=57,top=22,bottom=35,plotW=W-left-right,plotH=H-top-bottom;
 const max=Math.max(1,...rows.map(x=>Number(x[g.vol])||0))*1.25;
 const maxMean=Math.max(1,...rows.map(x=>g.staff?Math.max(x[g.vol]/g.staff,x[g.meta]/g.staff):0))*1.25;
 const xp=i=>left+plotW*(i+.5)/rows.length, y=v=>top+plotH*(1-v/max),ym=v=>top+plotH*(1-v/maxMean);
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Caixas e média por pessoa hora a hora de ${g.name}">`;
 for(let i=0;i<=4;i++){let yy=top+plotH*i/4;svg+=`<path d="M${left} ${yy}H${W-right}" stroke="#174050"/><text x="${left-8}" y="${yy+4}" text-anchor="end" fill="#c6d6e4" font-size="11">${n(max*(1-i/4))}</text><text x="${W-right+8}" y="${yy+4}" fill="#c6d6e4" font-size="11">${n(maxMean*(1-i/4))}</text>`;}
 rows.forEach((x,i)=>{let xx=xp(i),yy=y(x[g.vol]),s=x[g.status],sign=s==='✓'?'✓':s==='✕'?'✕':'−',fill=s==='✓'?'#00cf78':s==='✕'?'#ff3156':'#18394d';svg+=`<rect x="${xx-23}" y="${yy}" width="46" height="${top+plotH-yy}" fill="${g.fill}" opacity=".9"/><text x="${xx}" y="${yy-6}" text-anchor="middle" fill="white" font-size="12" font-weight="bold">${n(x[g.vol])}</text><text x="${xx}" y="${H-12}" text-anchor="middle" fill="white" font-size="12">${hour(x[0])}</text><circle cx="${xx}" cy="${top+8}" r="10" fill="${fill}"/><text x="${xx}" y="${top+12}" fill="white" text-anchor="middle" font-size="13">${sign}</text>`});
 const points=col=>rows.map((x,i)=>`${xp(i)},${ym(g.staff?x[col]/g.staff:0)}`).join(' ');
 svg+=`<polyline points="${points(g.meta)}" fill="none" stroke="#e2e9ef" stroke-width="2" stroke-dasharray="6 5"/><polyline points="${points(g.vol)}" fill="none" stroke="#ffd32c" stroke-width="3"/>`;
 rows.forEach((x,i)=>svg+=`<circle cx="${xp(i)}" cy="${ym(g.staff?x[g.vol]/g.staff:0)}" r="4" fill="#ffd32c"/>`);
 return svg+'</svg>';
}
function load(){const script=document.createElement('script');script.src='produtividade_t3.js?t='+Date.now();script.onload=()=>{try{render(window.PRODUTIVIDADE_T3)}catch(e){fail()};script.remove()};script.onerror=()=>{fail();script.remove()};document.body.appendChild(script)}
function fail(){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Não foi possível atualizar os dados. Verifique se produtividade_t3.js está nesta pasta. Se havia dados carregados, eles permanecem na tela.'}
load();setInterval(load,60000);
</script></body></html>
